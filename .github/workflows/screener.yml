name: Dosije screener
# Napomena: izmjenu termina (cron) mora potpisati nalog s pristupom ovom repozitoriju (vlasnik),
# jer GitHub pokreće zakazane preglede u ime onoga ko je zadnji mijenjao termin.
on:
  schedule:
    - cron: "47 3 * * *"   # 04:47 po Sarajevu zimi, 05:47 ljeti
    - cron: "27 4 * * *"   # rezerva ako GitHub preskoči prvi termin
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["screener.py", "config.json", "backtest_request.json", ".github/workflows/*.yml"]
permissions:
  contents: write
concurrency:
  group: screener
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keš rasporeda liga
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: fotmob-${{ github.run_id }}
          restore-keys: fotmob-
      - name: Provjera pravila na odigranim utakmicama
        if: hashFiles('backtest_request.json') != ''
        continue-on-error: true
        run: python screener.py --backtest && git rm -q backtest_request.json
      - name: Pregled utakmica
        continue-on-error: true
        run: python screener.py
      - name: Telegram poruka
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py
      - name: Sačuvaj keš
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: fotmob-${{ github.run_id }}
      - name: Spremi rezultate u repozitorij
        if: always()
        run: |
          git config user.name "dosije-bot"
          git config user.email "dosije-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nema promjena"; exit 0; fi
          git commit -m "Dosije screener $(date -u +%F)"
          git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours --no-edit origin main; }
          git push
